---
- name: "Clone Repo | Configure SSH known hosts"
  shell: |
    ssh-keyscan -H github.com >> /home/deploy/.ssh/known_hosts 2>/dev/null
  args:
    creates: /home/deploy/.ssh/known_hosts
  become: true
  become_user: deploy
  tags:
    - clone_repo
    - ssh

- name: "Clone Repo | Clone backend repository"
  git:
    repo: "{{ backend_repo }}"
    dest: "{{ backend_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: yes
    force: yes
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -i /home/deploy/.ssh/id_rsa"
  become: true
  become_user: deploy
  when: app_type == 'backend' or app_type == 'both'
  tags:
    - clone_repo
    - backend

- name: "Clone Repo | Clone frontend repository"
  git:
    repo: "{{ frontend_repo }}"
    dest: "{{ frontend_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: yes
    force: true
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -i /home/deploy/.ssh/id_rsa"
  become: true
  become_user: deploy
  when: app_type == 'frontend' or app_type == 'both'
  tags:
    - clone_repo
    - frontend

- name: "Clone Repo | Set repository permissions"
  file:
    path: "{{ item }}"
    owner: deploy
    group: deploy
    mode: "0755"
    recurse: true
  loop:
    - "{{ backend_dir }}"
    - "{{ frontend_dir }}"
  when: app_type != 'none'
  tags:
    - clone_repo
    - permissions
