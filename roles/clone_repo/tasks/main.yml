---
- name: "Clone Repo | Ensure .ssh directory exists"
  file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"
  become: true
  tags:
    - clone_repo
    - ssh

- name: "Clone Repo | Deploy SSH private key from vault"
  copy:
    content: "{{ vault_ssh_private_key }}"
    dest: /home/deploy/.ssh/id_rsa
    owner: deploy
    group: deploy
    mode: "0600"
  become: true
  no_log: true
  tags:
    - clone_repo
    - ssh

- name: "Clone Repo | Configure SSH known hosts for GitHub"
  known_hosts:
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -H github.com') }}"
    path: /home/deploy/.ssh/known_hosts
    state: present
  become: true
  become_user: deploy
  tags:
    - clone_repo
    - ssh

- name: "Clone Repo | Test SSH connection to GitHub"
  shell: ssh -T git@github.com
  register: github_test
  failed_when: false
  changed_when: false
  become: true
  become_user: deploy
  tags:
    - clone_repo
    - ssh
    - test

- name: "Clone Repo | Display GitHub SSH test result"
  debug:
    msg: "{{ github_test.stderr }}"
  when: github_test.stderr is defined
  tags:
    - clone_repo
    - ssh
    - test

- name: "Clone Repo | Clone backend repository"
  git:
    repo: "{{ backend_repo }}"
    dest: "{{ backend_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: yes
    force: yes
    key_file: /home/deploy/.ssh/id_rsa
  become: true
  become_user: deploy
  when: app_type == 'backend' or app_type == 'both'
  tags:
    - clone_repo
    - backend

- name: "Clone Repo | Clone frontend repository"
  git:
    repo: "{{ frontend_repo }}"
    dest: "{{ frontend_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: yes
    force: yes
    key_file: /home/deploy/.ssh/id_rsa
  become: true
  become_user: deploy
  when: app_type == 'frontend' or app_type == 'both'
  tags:
    - clone_repo
    - frontend

- name: "Clone Repo | Set repository permissions"
  file:
    path: "{{ item }}"
    owner: deploy
    group: deploy
    mode: "0755"
    recurse: true
  become: true
  loop:
    - "{{ backend_dir }}"
    - "{{ frontend_dir }}"
  when: app_type != 'none'
  tags:
    - clone_repo
    - permissions
