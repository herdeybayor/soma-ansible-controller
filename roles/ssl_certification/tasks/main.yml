---
- name: "SSL | Create certbot directory"
  file:
    path: /var/www/certbot
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags:
    - ssl
    - certbot

- name: "SSL | Check if certificate exists"
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_exists
  tags:
    - ssl
    - certbot

- name: "SSL | Generate self-signed certificate (temporary)"
  block:
    - name: "SSL | Create self-signed cert directory"
      file:
        path: "/etc/letsencrypt/live/{{ domain_name }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "SSL | Generate self-signed certificate"
      shell: |
        openssl req -x509 -newkey rsa:4096 -keyout /etc/letsencrypt/live/{{ domain_name }}/privkey.pem \
        -out /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem -days 1 -nodes \
        -subj "/CN={{ domain_name }}/O=Organization/C=US"
      args:
        creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  when: not cert_exists.stat.exists
  tags:
    - ssl
    - certbot
    - temporary

- name: "SSL | Check if certificate is a symlink (Let's Encrypt) or real file (self-signed)"
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_type_check
  tags:
    - ssl
    - certbot

- name: "SSL | Remove temporary self-signed certificate"
  file:
    path: "/etc/letsencrypt/live/{{ domain_name }}"
    state: absent
  when: cert_type_check.stat.exists and not cert_type_check.stat.islnk
  tags:
    - ssl
    - certbot

- name: "SSL | Delete all existing certificates for domain (to avoid -0001 suffix)"
  shell: |
    certbot delete --cert-name {{ domain_name }} --non-interactive 2>&1 || true
    certbot delete --cert-name {{ domain_name }}-0001 --non-interactive 2>&1 || true
    certbot delete --cert-name {{ domain_name }}-0002 --non-interactive 2>&1 || true
  register: cert_delete
  failed_when: false
  changed_when: "'Deleted' in cert_delete.stdout"
  when: cert_type_check.stat.exists and not cert_type_check.stat.islnk
  tags:
    - ssl
    - certbot

- name: "SSL | Generate Let's Encrypt certificate (force renewal if symlinks broken)"
  shell: |
    if [ ! -L "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem" ] && [ -d "/etc/letsencrypt/archive/{{ domain_name }}" ]; then
      # Symlinks are broken but archive exists - force renewal to recreate symlinks
      certbot certonly \
        --force-renewal \
        --webroot \
        --webroot-path=/var/www/certbot \
        --domain {{ domain_name }} \
        --non-interactive \
        --agree-tos \
        --email {{ certbot_email }} \
        --preferred-challenges http \
        --rsa-key-size 4096
    else
      # Normal cert request
      certbot certonly \
        --webroot \
        --webroot-path=/var/www/certbot \
        --domain {{ domain_name }} \
        --non-interactive \
        --agree-tos \
        --email {{ certbot_email }} \
        --preferred-challenges http \
        --rsa-key-size 4096
    fi
  register: certbot_result
  changed_when: "'Successfully received certificate' in certbot_result.stdout"
  failed_when: certbot_result.rc != 0 and 'Account registered' not in certbot_result.stdout
  tags:
    - ssl
    - certbot

- name: "SSL | Setup automatic renewal cron job"
  cron:
    name: "Certbot auto-renewal"
    minute: "0"
    hour: "3"
    weekday: "0"
    job: "/usr/bin/certbot renew --quiet --post-hook 'systemctl reload nginx'"
    user: root
  tags:
    - ssl
    - certbot
    - cron

- name: "SSL | Verify cron job exists"
  shell: crontab -l | grep certbot
  register: cron_check
  changed_when: false
  failed_when: cron_check.rc != 0
  tags:
    - ssl
    - certbot
    - verify

- name: "SSL | Set certificate permissions"
  file:
    path: "/etc/letsencrypt/live/{{ domain_name }}"
    owner: root
    group: root
    mode: "0755"
    recurse: yes
  tags:
    - ssl
    - permissions

- name: "SSL | Find actual certificate path (may have -0001 suffix)"
  shell: |
    if [ -f "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem" ]; then
      echo "/etc/letsencrypt/live/{{ domain_name }}"
    elif [ -f "/etc/letsencrypt/live/{{ domain_name }}-0001/fullchain.pem" ]; then
      echo "/etc/letsencrypt/live/{{ domain_name }}-0001"
    else
      echo "NOT_FOUND"
    fi
  register: cert_path_result
  changed_when: false
  tags:
    - ssl
    - nginx_update

- name: "SSL | Verify SSL certificate exists post-setup"
  stat:
    path: "{{ cert_path_result.stdout }}/fullchain.pem"
  register: final_cert_check
  when: cert_path_result.stdout != "NOT_FOUND"
  tags:
    - ssl
    - nginx_update

- name: "SSL | Set certificate path fact"
  set_fact:
    actual_cert_path: "{{ cert_path_result.stdout }}"
  when: cert_path_result.stdout != "NOT_FOUND"
  tags:
    - ssl
    - nginx_update

- name: "SSL | Create symlink if certificate is at -0001 path"
  file:
    src: "{{ cert_path_result.stdout }}"
    dest: "/etc/letsencrypt/live/{{ domain_name }}"
    state: link
  when:
    - cert_path_result.stdout != "NOT_FOUND"
    - cert_path_result.stdout | string != "/etc/letsencrypt/live/" + domain_name
  tags:
    - ssl
    - nginx_update

- name: "SSL | Set SSL certificate fact (post-setup)"
  set_fact:
    ssl_cert_exists: "{{ final_cert_check.stat.exists | default(false) }}"
  when: cert_path_result.stdout != "NOT_FOUND"
  tags:
    - ssl
    - nginx_update

- name: "SSL | Regenerate Nginx configuration with HTTPS"
  template:
    src: "../../nginx_reverse_proxy/templates/nginx.conf.j2"
    dest: "/etc/nginx/sites-available/{{ domain_name }}"
    owner: root
    group: root
    mode: "0644"
  when: final_cert_check.stat.exists
  tags:
    - ssl
    - nginx_update

- name: "SSL | Test Nginx configuration"
  shell: nginx -t
  register: nginx_test
  failed_when: nginx_test.rc != 0
  when: final_cert_check.stat.exists
  tags:
    - ssl
    - nginx_update

- name: "SSL | Reload Nginx to apply HTTPS configuration"
  systemd:
    name: nginx
    state: reloaded
  when: final_cert_check.stat.exists
  tags:
    - ssl
    - nginx_update
