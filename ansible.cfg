[defaults]
# Inventory configuration
inventory = inventory/staging
host_key_checking = False

# Roles path
roles_path = ./roles

# Remote user and SSH
remote_user = deploy
timeout = 300

# Vault configuration
# Playbooks need vault for AWS credentials (vault_aws_access_key_id, vault_aws_secret_access_key)
ask_vault_pass = True

# Output formatting
stdout_callback = yaml
callback_whitelist = profile_tasks
force_color = True

# Privilege escalation
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r